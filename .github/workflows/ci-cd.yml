name: CI/CD Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

env:
  SONAR_ORG: fahadshaikh736
  SONAR_PROJECT_KEY: fahadshaikh736_cicd-demo
  JFROG_HOST: cicddemo736.jfrog.io
  JFROG_MAVEN_REPO: app-maven-local
  JFROG_DOCKER_REPO: app-docker-local
  IMAGE_NAME: cicd-demo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ env.SONAR_ORG }}
          -Dsonar.host.url=https://sonarcloud.io

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Upload JAR to JFrog Artifactory
        run: jf rt upload "target/*.jar" "${{ env.JFROG_MAVEN_REPO }}/${{ github.ref_name }}/${{ github.sha }}/"

      - name: Log in to JFrog Docker registry
        run: echo "${{ secrets.JF_ACCESS_TOKEN }}" | docker login ${{ env.JFROG_HOST }} -u "${{ secrets.JF_USER }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ env.JFROG_HOST }}/${{ env.JFROG_DOCKER_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Docker image to JFrog
        run: docker push ${{ env.JFROG_HOST }}/${{ env.JFROG_DOCKER_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}