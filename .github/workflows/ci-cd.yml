name: CI/CD Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

env:
  SONAR_ORG: fahadshaikh736
  SONAR_PROJECT_KEY: fahadshaikh736_cicd-demo
  JFROG_HOST: cicddemo736.jfrog.io
  JFROG_MAVEN_REPO: app-maven-local
  JFROG_DOCKER_REPO: app-docker-local
  IMAGE_NAME: cicd-demo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ env.SONAR_ORG }}
          -Dsonar.host.url=https://sonarcloud.io

      - name: Upload JAR to JFrog Artifactory
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
        run: |
          JAR=$(ls target/*.jar | head -n 1)
          curl -f -H "Authorization: Bearer $JF_ACCESS_TOKEN" \
            -T "$JAR" \
            "$JF_URL/artifactory/$JFROG_MAVEN_REPO/$GITHUB_REF_NAME/$GITHUB_SHA/$(basename "$JAR")"

      - name: Log in to JFrog Docker registry
        env:
          JF_USER: ${{ secrets.JF_USER }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
        run: echo "$JF_ACCESS_TOKEN" | docker login "$JFROG_HOST" -u "$JF_USER" --password-stdin

      - name: Build Docker image
        run: docker build -t "$JFROG_HOST/$JFROG_DOCKER_REPO/$IMAGE_NAME:$GITHUB_SHA" .

      - name: Push Docker image to JFrog
        run: docker push "$JFROG_HOST/$JFROG_DOCKER_REPO/$IMAGE_NAME:$GITHUB_SHA"